name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build:libs
      - name: Build documentation site
        working-directory: docs
        env:
          GITHUB_PAGES: 'true'
        run: |
          npm ci
          npm run build
      - run: GITHUB_PAGES=true npm run build:flipdeck
        env:
          GITHUB_PAGES: 'true'
      - name: Compose deploy site
        run: |
          mkdir -p _site
          cp -r docs/build/* _site/
          mkdir -p _site/flipdeck
          cp -r apps/showcase/dist/* _site/flipdeck/
          mkdir -p _site/showcase
          cp -r apps/showcase/dist/* _site/showcase/
          node --input-type=module -e 'import { mkdirSync, writeFileSync } from "node:fs"; import { flipCardManifestSchema } from "./packages/core/dist/schema.js"; mkdirSync("_site/schema", { recursive: true }); writeFileSync("_site/schema/v0.1.json", JSON.stringify(flipCardManifestSchema, null, 2) + "\n");'
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
