<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adaptive Slide</title>
<script>
  (() => {
    const param = new URLSearchParams(window.location.search).get("scoutTheme");
    const theme =
      param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<style>
  :root {
    color-scheme: light;
    --cp-bg: #f7f4ef;
    --cp-bg-elevated: #fcfbf8;
    --cp-surface: #ffffff;
    --cp-surface-soft: #f5f5f5;
    --cp-border: #dedede;
    --cp-border-strong: #919191;
    --cp-text: #242424;
    --cp-text-muted: #5c5c5c;
    --cp-text-soft: #6f6f6f;
    --cp-accent: #b11f4b;
    --cp-accent-hover: #9a1a41;
    --cp-accent-soft: rgba(177, 31, 75, 0.08);
    --cp-accent-fg: #ffffff;
    --cp-success: #16a34a;
    --cp-danger: #dc2626;
    --cp-warning: #f59e0b;
    --cp-link: #0078d4;
    --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
    --cp-overlay: rgba(255, 255, 255, 0.8);
    --cp-panel: rgba(255, 255, 255, 0.86);
    --cp-panel-strong: rgba(255, 255, 255, 0.96);
    --cp-sheen: rgba(255, 255, 255, 0.55);
    --cp-highlight: rgba(177, 31, 75, 0.12);
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --cp-bg: #3d3b3a;
    --cp-bg-elevated: #343231;
    --cp-surface: #292929;
    --cp-surface-soft: #2e2e2e;
    --cp-border: #474747;
    --cp-border-strong: #5f5f5f;
    --cp-text: #dedede;
    --cp-text-muted: #919191;
    --cp-text-soft: #b0b0b0;
    --cp-accent: #fd8ea1;
    --cp-accent-hover: #fb7b91;
    --cp-accent-soft: rgba(253, 142, 161, 0.14);
    --cp-accent-fg: #1a1a1a;
    --cp-success: #4ade80;
    --cp-danger: #f87171;
    --cp-warning: #fbbf24;
    --cp-link: #4da6ff;
    --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
    --cp-overlay: rgba(41, 41, 41, 0.88);
    --cp-panel: rgba(41, 41, 41, 0.72);
    --cp-panel-strong: rgba(41, 41, 41, 0.96);
    --cp-sheen: rgba(255, 255, 255, 0.04);
    --cp-highlight: rgba(253, 142, 161, 0.12);
  }
  :root { font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--cp-text); background: var(--cp-bg); }
  header { padding: 12px 16px; background: var(--cp-surface); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  header strong { margin-right: auto; }
  button { font: inherit; background: var(--cp-accent); color: var(--cp-accent-fg); border: 0; border-radius: .625rem; padding: 8px 12px; cursor: pointer; }
  button:hover:not(:disabled) { background: var(--cp-accent-hover); }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible { outline: 3px solid var(--cp-link); outline-offset: 3px; }
  #viewport { padding: 24px; min-height: 300px; }
  .slide { display: grid; gap: 16px; }
  .tile { overflow-wrap: anywhere; min-width: 0; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--cp-surface-soft); padding: 12px; border-radius: .625rem; font-family: Consolas, "Courier New", Courier, monospace; }
  .container { display: flex; gap: 12px; }
  .container > * { flex: 1; }
  #notes, #status, #slide-list { padding: 12px 24px; }
  #notes { border-top: 1px solid var(--cp-border); font-size: .9rem; }
  #status { color: var(--cp-text-muted); }
  table { width: 100%; border-collapse: collapse; } td, th { text-align: left; padding: 8px; border-bottom: 1px solid var(--cp-border); }
  [hidden] { display: none !important; }
  @media (max-width: 600px) { .slide { grid-template-columns: 1fr !important; } .container { flex-direction: column; } }
</style>
</head>
<body>
  <header><strong id="deck-title">Adaptive Slide</strong><button id="prev" disabled>Previous</button><span id="counter">–</span><button id="next" disabled>Next</button><button id="list" disabled>List slides</button></header>
  <main id="viewport" aria-live="polite">Waiting for deck data…</main>
  <aside id="notes" hidden></aside>
  <div id="status" role="status">Connecting to host…</div>
  <pre id="slide-list" hidden></pre>
  <!-- APP_SCRIPT -->
</body>
</html>
